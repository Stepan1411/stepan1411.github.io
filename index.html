    <div class="container">
        <div class="profile">
            <div class="avatar">
                <img src="sourcres/avatar.png" alt="Stepan1411" id="avatarImg">

            <h1 class="username">Stepan1411</h1>

        <div class="links">

                <span class="icon">💬</span>
                <span class="text">DISCORD</span>
            </a>

            <a href="#" class="link projects" data-en="PROJECTS" data-ru="ПРОЕКТЫ" target="_blank" rel="noopener noreferrer">
                <span class="icon">📋</span>

        <div class="about">
            <p class="about-text" data-en="Hello everyone! My name is Stepan, and I'm passionate about Minecraft! I enjoy creating mods, datapacks, mod builds, and servers. Modding is my favorite hobby, and I enjoy bringing creative ideas to life in the Minecraft universe!" data-ru="Привет всем! Меня зовут Степан, и я страстно люблю Minecraft! Мне нравится создавать моды, датапаки, сборки модов и серверы. Разработка моддинг — мои любимые хобби, и я получаю удовольствие, воплощая творческие идеи во вселенной Minecraft!">
